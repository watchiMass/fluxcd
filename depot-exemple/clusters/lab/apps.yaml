apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lab-apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/lab
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: lab-demo
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: web
      namespace: lab-demo
